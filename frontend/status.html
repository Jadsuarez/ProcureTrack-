<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Status Queue - Procurement Monitoring</title>
  <link rel="stylesheet" href="css/style.css?v=20">
</head>
<body>
  <main class="container-wide">
    <div id="alertBox" class="hidden"></div>
    <div class="card">
      <h2 id="statusHeading">Status Queue</h2>
      <p class="text-muted" id="statusSubtitle">Requests currently in this status.</p>
    </div>
    <div class="card">
      <div class="status-page-summary"><strong id="statusTotal">0</strong> request(s)</div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tracking ID</th>
              <th>Title</th>
              <th>Status</th>
              <th>Last Updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="statusRequestsBody">
            <tr><td colspan="5" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </main>
  <footer class="app-footer">PROCUREMENT - Monitoring System</footer>
  <script src="js/api.js?v=17"></script>
  <script src="js/app.js?v=23"></script>
  <script src="js/status.js?v=1"></script>
</body>
</html>
