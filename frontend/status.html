<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Requests Dashboard - Procurement Monitoring</title>
  <link rel="stylesheet" href="css/style.css?v=30">
</head>
<body>
  <main class="container-wide">
    <div id="alertBox" class="hidden"></div>
    <div class="card">
      <h2 id="statusHeading">Office Requests</h2>
      <p class="text-muted" id="statusSubtitle">All requests visible to this office.</p>
    </div>
    <div class="card">
      <div class="request-list-toolbar">
        <strong><span id="statusTotal">0</span> requests</strong>
        <label for="officeRequestSearch">Search</label>
        <input type="search" id="officeRequestSearch" placeholder="Tracking ID or title" aria-label="Search requests">
        <label for="officeRequestFilter">Filter by status</label>
        <select id="officeRequestFilter" aria-label="Filter requests by status">
          <option value="all">All statuses</option>
        </select>
        <label for="minimumRequestAmount">Price from</label>
        <input type="number" id="minimumRequestAmount" min="0" step="0.01" placeholder="0.00" aria-label="Minimum request amount">
        <label for="maximumRequestAmount">Price to</label>
        <input type="number" id="maximumRequestAmount" min="0" step="0.01" placeholder="No limit" aria-label="Maximum request amount">
        <button type="button" class="btn btn-sm btn-secondary" id="exportRequestsBtn">Export CSV</button>
        <label for="officeRequestSort">Sort by</label>
        <select id="officeRequestSort" aria-label="Sort office requests">
          <option value="updated_desc">Last updated (newest)</option>
          <option value="updated_asc">Last updated (oldest)</option>
          <option value="created_desc">Created (newest)</option>
          <option value="created_asc">Created (oldest)</option>
          <option value="title_asc">Title (A-Z)</option>
          <option value="title_desc">Title (Z-A)</option>
          <option value="status_asc">Status (A-Z)</option>
          <option value="status_desc">Status (Z-A)</option>
        </select>
      </div>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>Tracking ID</th>
              <th>Title</th>
              <th>Status</th>
              <th>Amount</th>
              <th>Last Updated</th>
              <th></th>
            </tr>
          </thead>
          <tbody id="statusRequestsBody">
            <tr><td colspan="6" class="text-muted">Loading...</td></tr>
          </tbody>
        </table>
      </div>
      <div class="request-pagination" aria-label="Request pages">
        <button type="button" class="btn btn-sm btn-secondary" id="previousRequestPage">Previous</button>
        <span id="requestPageInfo">Page 1</span>
        <button type="button" class="btn btn-sm btn-secondary" id="nextRequestPage">Next</button>
      </div>
    </div>
  </main>
  <footer class="app-footer">PROCUREMENT - Monitoring System</footer>
  <script src="js/api.js?v=23"></script>
  <script src="js/app.js?v=27"></script>
  <script src="js/status.js?v=5"></script>
</body>
</html>
